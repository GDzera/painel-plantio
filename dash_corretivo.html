<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Controle Corretivos SF 26/27</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f3f4f6;--card:#fff;--rz:#00843D;--rz2:#004D23;--bl:#1565C0;--am:#F59E0B;--red:#DC2626;--tx:#1a1a2e;--tx2:#6b7280;--brd:#e5e7eb;--ok:#10B981;--bad:#EF4444;--warn:#F59E0B}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);font-size:13px}
.topbar{background:linear-gradient(135deg,var(--rz2),var(--rz));color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:18px;font-weight:800;letter-spacing:-.02em}
.topbar .sub{font-size:11px;opacity:.7}
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--brd);padding:0 16px;gap:0;overflow-x:auto}
.tab{padding:14px 22px;font-weight:700;font-size:13px;color:var(--tx2);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;transition:all .2s}
.tab.on{color:var(--rz);border-bottom-color:var(--rz)}
.tab:hover{color:var(--rz)}
.pg{display:none;padding:16px 20px;max-width:1440px;margin:0 auto}.pg.on{display:block}
.pg-map{display:none;padding:0;max-width:100%;margin:0}.pg-map.on{display:flex;flex-direction:column;height:calc(100vh - 110px)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:12px;padding:16px;border-left:4px solid var(--rz);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.kpi.bl{border-left-color:var(--bl)}.kpi.am{border-left-color:var(--am)}.kpi.red{border-left-color:var(--red)}.kpi.ok{border-left-color:var(--ok)}
.kpi-lb{font-size:10px;color:var(--tx2);text-transform:uppercase;font-weight:700;letter-spacing:.04em;margin-bottom:4px}
.kpi-vl{font-size:24px;font-weight:800}
.kpi-sub{font-size:10px;color:var(--tx2);margin-top:2px}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-title{font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--rz);color:#fff;padding:10px 8px;text-align:left;font-weight:700;position:sticky;top:0;z-index:10}
td{padding:8px;border-bottom:1px solid var(--brd)}
tr:hover td{background:#f9fafb}
.num{text-align:right;font-variant-numeric:tabular-nums}
.st-ok{background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}
.st-bad{background:#fee2e2;color:#991b1b;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}
.st-stock{background:#dbeafe;color:#1e40af;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}
.st-na{background:#f3f4f6;color:#9ca3af;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.filter-bar input,.filter-bar select{border:2px solid var(--brd);border-radius:8px;padding:8px 12px;font-size:12px;font-family:inherit}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--rz);outline:none}
.filter-bar label{font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase}
.badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700}
.b-tratos{background:#d1fae5;color:#065f46}.b-reforma{background:#ede9fe;color:#5b21b6}.b-ambos{background:#fef3c7;color:#92400e}.b-estoque{background:#dbeafe;color:#1e40af}.b-sem{background:#f3f4f6;color:#9ca3af}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase}
.form-group input,.form-group select{border:2px solid var(--brd);border-radius:8px;padding:10px 14px;font-size:14px;font-family:inherit}
.form-group input:focus,.form-group select:focus{border-color:var(--rz);outline:none;box-shadow:0 0 0 3px rgba(0,132,61,.15)}
.btn{border:none;border-radius:8px;padding:12px 24px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-rz{background:var(--rz);color:#fff}.btn-rz:hover{background:var(--rz2)}
.btn-ci{background:#e5e7eb;color:var(--tx)}.btn-ci:hover{background:#d1d5db}
.msg{padding:12px 16px;border-radius:8px;margin-bottom:12px;font-weight:600;font-size:13px;display:none}
.msg.ok{display:block;background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
.msg.err{display:block;background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.nf-list{max-height:400px;overflow-y:auto;margin-top:12px}
.chart-c{position:relative;height:280px}
/* Mapa */
#map{flex:1;min-height:0}
.map-toolbar{background:#fff;border-bottom:1px solid var(--brd);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex-shrink:0}
.map-toolbar select,.map-toolbar input{border:2px solid var(--brd);border-radius:8px;padding:6px 10px;font-size:12px;font-family:inherit}
.map-toolbar select:focus,.map-toolbar input:focus{border-color:var(--rz);outline:none}
.map-toolbar label{font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase}
.map-legend{background:#fff;border-radius:10px;padding:10px 14px;box-shadow:0 2px 8px rgba(0,0,0,.15);line-height:1.8;font-size:12px;font-weight:600}
.map-legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle;border:2px solid rgba(0,0,0,.2)}
.map-stat-bar{background:#fff;border-top:1px solid var(--brd);padding:8px 16px;display:flex;gap:20px;flex-shrink:0;flex-wrap:wrap;font-size:11px;font-weight:700;color:var(--tx2)}
.map-stat-bar span{color:var(--tx)}
.leaflet-popup-content-wrapper{border-radius:10px!important;box-shadow:0 4px 20px rgba(0,0,0,.15)!important}
.leaflet-popup-content{margin:14px!important;font-family:'DM Sans',sans-serif!important;min-width:220px}
.pop-title{font-size:14px;font-weight:800;margin-bottom:8px;color:#1a1a2e}
.pop-zona{font-size:11px;color:#6b7280;margin-bottom:8px}
.pop-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f3f4f6;font-size:12px}
.pop-row:last-child{border-bottom:none}
.pop-label{color:#6b7280}
.pop-val{font-weight:700;color:#1a1a2e}
.pop-badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;margin-bottom:8px}
.rodape{text-align:center;color:var(--tx2);font-size:10px;padding:16px 0;border-top:1px solid var(--brd);margin-top:20px}
@media(max-width:768px){.grid-2{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}

</style></head><body>
<style>
.login-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#004D23 0%,#00843D 50%,#006830 100%);display:flex;align-items:center;justify-content:center;z-index:9999;font-family:'Plus Jakarta Sans',sans-serif}
.login-box{background:#fff;border-radius:20px;padding:48px 40px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
.login-logo{width:64px;height:64px;background:#00843D;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#fff;margin-bottom:20px;font-family:'JetBrains Mono',monospace}
.login-title{font-size:22px;font-weight:800;color:#1a2e22;margin-bottom:6px}
.login-sub{font-size:13px;color:#5a7265;margin-bottom:28px}
.login-input{width:100%;padding:14px 16px;border:2px solid #e0e8e3;border-radius:10px;font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;margin-bottom:12px;outline:none;transition:border-color .2s;box-sizing:border-box}
.login-input:focus{border-color:#00843D}
.login-btn{width:100%;padding:14px;border:none;border-radius:10px;background:#00843D;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:background .2s;margin-top:4px}
.login-btn:hover{background:#006830}
.login-btn:active{transform:scale(0.98)}
.login-error{color:#d63031;font-size:12px;font-weight:600;margin-top:12px;min-height:18px}
.login-footer{font-size:10px;color:rgba(255,255,255,.5);position:fixed;bottom:16px;left:0;right:0;text-align:center}
.login-lock{font-size:11px;color:#5a7265;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:4px}
.login-loading{display:none;margin-top:12px;font-size:12px;color:#00843D;font-weight:600}
</style>

function sha256(s){return CryptoJS.SHA256(s).toString()}

function doLogin(){
  const user=document.getElementById('loginUser').value.trim().toLowerCase();
  const pass=document.getElementById('loginPass').value;
  const errEl=document.getElementById('loginError');
  const loadEl=document.getElementById('loginLoading');
  const btnEl=document.getElementById('loginBtn');

  errEl.textContent='';
  if(!user||!pass){errEl.textContent='Preencha usuário e senha.';return}

  const uData=_U[user];
  if(!uData){errEl.textContent='Usuário não encontrado.';return}

  const passHash=sha256(pass);
  if(passHash!==uData.h){errEl.textContent='Senha incorreta.';return}

  btnEl.disabled=true;
  btnEl.textContent='Aguarde...';
  loadEl.style.display='block';

  setTimeout(function(){
    try{
      var mk=CryptoJS.AES.decrypt(uData.mk,pass).toString(CryptoJS.enc.Utf8);
      if(!mk){errEl.textContent='Erro na descriptografia.';btnEl.disabled=false;btnEl.textContent='Entrar';loadEl.style.display='none';return}

      var body=CryptoJS.AES.decrypt(_E,mk).toString(CryptoJS.enc.Utf8);
      if(!body){errEl.textContent='Erro ao carregar dados.';btnEl.disabled=false;btnEl.textContent='Entrar';loadEl.style.display='none';return}

      document.getElementById('loginOverlay').style.display='none';
      var dc=document.getElementById('dashContent');
      dc.style.display='block';
      dc.innerHTML=body;

      // Re-create ONLY executable scripts (skip type=application/json data containers)
      dc.querySelectorAll('script').forEach(function(old){
        if(old.type && old.type !== 'text/javascript' && old.type !== '') return; // skip JSON data tags
        var s=document.createElement('script');
        if(old.src){s.src=old.src}else{s.textContent=old.textContent}
        old.parentNode.replaceChild(s,old);
      });

      // Fire DOMContentLoaded manually for scripts that listen to it
      window.dispatchEvent(new Event('DOMContentLoaded'));

      sessionStorage.setItem('cct_auth','1');
    }catch(e){
      console.error(e);
      errEl.textContent='Falha na autenticação.';
      btnEl.disabled=false;
      btnEl.textContent='Entrar';
      loadEl.style.display='none';
    }
  },100);
}

document.getElementById('loginUser').focus();
</script>
